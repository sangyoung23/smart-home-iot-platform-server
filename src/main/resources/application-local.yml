spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import: optional:file:.env[.properties]

  data:
    mongodb:
      uri: ${LOCAL_MONGODB_URI}

  redis:
    host: localhost
    port: 6379

server:
  port: 8080