spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: smart-home-iot

  logging:
    level:
      org.springframework.boot.context.config: DEBUG

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    context-path: /api
  port: 8080

jwt:
  header: Authorization
  expiration: 36000
