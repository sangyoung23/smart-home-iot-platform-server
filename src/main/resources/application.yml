spring:
  application:
    name: smart-home-iot

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    context-path: /api
  port: 8080

jwt:
  header: Authorization
  expiration: 36000
